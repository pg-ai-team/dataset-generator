name: Publish dataset to Kaggle
on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt kaggle

      - name: Generate dataset
        run: python main.py

      - name: Copy dataset metadata
        run: cp data/dataset-metadata.json data/KEGG_Pathway_Image/

      - name: Upload new dataset version to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle datasets create -p data/KEGG_Pathway_Image/ --dir-mode tar